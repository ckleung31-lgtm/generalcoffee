<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>Running Dashboard</title>
</head>
<body>

<h2>🏃 Running Dashboard</h2>

<label>每週跑量 (km):</label><br>
<input id="mileage"><br><br>

<label>年齡:</label><br>
<input id="age"><br><br>

<label>配速 (mm:ss):</label><br>
<input id="pace" placeholder="例如 5:00"><br><br>

<label>心率方法:</label><br>
<select id="method">
  <option value="basic">220 - age</option>
  <option value="karvonen">Karvonen</option>
</select><br><br>

<div id="karvonenBox" style="display:none;">
  Max HR:<br>
  <input id="maxHr"><br><br>
  Rest HR:<br>
  <input id="restHr"><br><br>
</div>

<hr>

<label>目標:</label><br>
<select id="goal">
  <div id="weeksHint" style="color:gray;"></div>
  <option value="5K">5K</option>
  <option value="10K">10K</option>
  <option value="HM">HM</option>
  <option value="FM">FM</option>
</select><br><br>

<label>訓練週數:</label><br>
<input id="weeks" placeholder="例如 12"><br><br>

<button onclick="calculate()">計算 + 生成課表</button>

<h3>結果</h3>
<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
